# Point-cloud pipeline parameters. Units are in the names; descriptions and
# valid ranges are exposed through `ros2 param describe /perception <name>`.
# Floating-point parameters must be written with a decimal point.
perception:
  ros__parameters:
    target_frame: base_footprint
    expected_rate_hz: 10.0
    tf_timeout_s: 0.1

    # Measured from the LiDAR origin. 0.5 m clears the mast and chassis.
    min_range_m: 0.5
    max_range_m: 25.0

    # Box in base_footprint. z = 2.0 m: points above the robot cannot block it.
    roi_min_x_m: -20.0
    roi_max_x_m: 20.0
    roi_min_y_m: -20.0
    roi_max_y_m: 20.0
    roi_min_z_m: -0.3
    roi_max_z_m: 2.0

    voxel_leaf_size_m: 0.08

    ground_max_height_m: 0.3
    ground_distance_threshold_m: 0.06
    ground_max_tilt_rad: 0.15
    ground_ransac_iterations: 100
    ground_min_inliers: 50

    # At 0.4 deg horizontal resolution, neighbouring returns on one surface are
    # at most 25 m * 0.007 = 0.17 m apart inside max_range_m, so 0.25 m keeps
    # an object connected along a ring while separating pallets placed 0.3 m
    # apart. The 2 deg ring spacing exceeds 0.25 m beyond ~7 m, so distant
    # tall objects can split into per-ring clusters: an accepted trade-off.
    cluster_tolerance_m: 0.25
    cluster_min_points: 8
    cluster_max_points: 20000
